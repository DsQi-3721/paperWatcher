<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>长尾夹和回形针</title></head><body>
<script src="core.js"></script>
<script src="kit.js"></script>
<script>
/* Fig. 14 — Binder clip and paperclips (长尾夹和回形针) on a stack of quiz papers, with a tray of paperclips.
   Desk turned toward the viewer (kit deskSetup): u along the front edge, v toward the viewer, z up; 1 unit = 1 mm.

   How they really work:
   1. Binder clip: a band of spring steel bent into a triangle: a flat back (the spine), two sides that meet at the jaws.
      The jaw edges are rolled into small tubes, and each wire handle's two ends are bent inward into one of them, so the
      handle pivots there. Squeeze the handles together: each handle bears on its side of the triangle as a lever and
      pulls its jaw open. Slide the stack in, let go: the steel springs back and grips. Then fold the handles down flat.
   2. Gem paperclip: one 1 mm steel wire, ~108 mm long, bent three times into an outer and an inner loop. Slid onto the
      corner of a few sheets, the paper goes between the loops: the inner loop under, the outer loop over; the wire's
      spring squeezes them together.
   3. Student life: unbending a paperclip bend by bend in class (it never goes quite straight again), hooking clip into
      clip into a chain across the desk, and squeezing a binder clip's handle until its ends pop out of the rolled edge,
      so the clip lies flat (and then can't be opened any more).

   Parts:
   BINDER  lower side . spine . upper side (spring steel, painted) . two rolled edges at the jaws . upper handle . lower
           handle (wire loops, ends bent into the rolls)
   CLIP    the wire: free end . long outer leg . big outer bend . top leg . end bend . inner leg . inner bend . short leg .
           free end
   DESK    desk board . stack of quiz papers (print, score) . paperclip tray (walls, floor, clips in it) . a chain of clips .
           an unbent wire . loose binder handles */

/* ---------- layout ---------- */
const DLU = 206, DLV = 124, BH = 4;
const DESK = deskSetup(DLU, DLV, 76, 36);
const BTOP = deskTop(DLU, DLV, BH, 6);
const STK = { u0: -74, u1: 28, v0: -40, v1: 26, n: 8, t: .15 };          // the quiz stack
const stkTop = () => BH + STK.n*STK.t;
const TRAY = { u0: 46, u1: 86, v0: -44, v1: -8, h: 9, wall: 1.6 };
const N_CLIPS = 14, CHAIN0 = [-44, 50], LINK_PITCH = 25, CHAIN_MAX = 5;
const BC = { W: 32, D: 15, H: 12, th: .55, r: .95, hl: 22 };            // binder clip: width, depth, spine height
// the clip's frame: O = middle of the spine's foot, turned ang (deg) about z from X = u, Y = v (Y points into the jaws)
const bcF = (O, ang) => { const a = ang*Math.PI/180; return { O, ang, X: norm(dkv(Math.cos(a), Math.sin(a))), Y: norm(dkv(-Math.sin(a), Math.cos(a))) }; };
const BC_REST = bcF(dk(-86, 56, BH), 180);                                 // lying empty, jaws toward the far side
const BC_ON = bcF(dk(-22, STK.v0 - 6, BH), 0);                             // paper 9 mm into the jaws
const WIRE = '#d9dfe2', WIRE_R = .55;

/* ---------- the paperclip: a turtle path (lengths and 180 deg bends), so it can be unbent ---------- */
// lengths and bends from the free end of the long outer leg; bend k is scaled by (1 - open[k])
const GEM = [ { L: 21 }, { r: 4, a: 180 }, { L: 25 }, { r: 2.5, a: 180 }, { L: 22 }, { r: 1.6, a: 180 }, { L: 15 } ];
function gemPath(open = [0, 0, 0], kink = 0){
  const pts = [[25, 0]]; let x = 25, y = 0, h = Math.PI, bi = 0;            // start heading -x along y = 0
  const rnd = kRng(5);
  for (const g of GEM){
    if (g.L){ const n = Math.ceil(g.L/3); for (let i = 1; i <= n; i++){ const w = kink ? kink*Math.sin(i*1.7 + bi)*1.2 : 0; x += Math.cos(h)*g.L/n; y += Math.sin(h)*g.L/n; pts.push([x - Math.sin(h)*w, y + Math.cos(h)*w]); } }
    else { const a = -g.a*Math.PI/180*(1 - open[bi]) - (open[bi] > .99 ? (rnd() - .5)*.5*kink : 0), n = 8;
      for (let i = 1; i <= n; i++){ const dh = a/n, ch = g.r*2*Math.sin(Math.abs(dh)/2); h += dh/2; x += Math.cos(h)*ch; y += Math.sin(h)*ch; h += dh/2; pts.push([x, y]); }
      bi++; }
  }
  return pts;
}
// which points of the closed clip are the inner loop (they go under the paper when it is clipped on)
const GEM_JOIN = 29, GEM_INNER = (() => { const p = gemPath(); return p.map((_, i) => i >= GEM_JOIN); })();
// a wire drawn as an inked tube with a highlight; pts in world
function wireSvg(pts, r = WIRE_R, col = WIRE){
  const d = pd(pts, false), w = 2*r;
  return `<path d="${d}" fill="none" stroke="${INK}" style="stroke-width:${f(w + .7*INK_K)}" stroke-linecap="round" stroke-linejoin="round"/>`
    + `<path d="${d}" fill="none" stroke="${col}" style="stroke-width:${f(w)}" stroke-linecap="round" stroke-linejoin="round"/>`
    + `<path d="${d}" fill="none" stroke="#ffffff" style="stroke-width:${f(w*.35)}" stroke-linecap="round" stroke-linejoin="round" opacity=".7" transform="translate(${f(-.25*w)} ${f(-.25*w)})"/>`;
}
// a paperclip placed: frame { O (its 0,0 point), A (along its length), B (across), z }, a lift per point (z)
const clipPts = (c, path) => path.map(([x, y], i) => kAdd(kAdd(kAdd(c.O, kScl(c.A, x)), kScl(c.B, y)), [0, 0, (c.zs ? c.zs[i] : 0)]));
const clipAt = (u, v, deg, z) => { const r = deg*Math.PI/180; return { O: dk(u, v, z), A: norm(dkv(Math.cos(r), Math.sin(r))), B: norm(dkv(-Math.sin(r), Math.cos(r))) }; };

/* ---------- the binder clip ---------- */
const bcP = (F, x, y, z) => kAdd(kAdd(kAdd(F.O, kScl(F.X, x)), kScl(F.Y, y)), [0, 0, z]);
const bcV = (F, y, z) => kAdd(kScl(F.Y, y), [0, 0, z]);
// st.bc: { F (frame), zU (upper jaw tip height), up / lo (handle angles, deg from +Y toward +z), hu / hl (handles on), pinch, lift }
function bcWalls(b){
  const { D, H, th, W } = BC, zU = b.zU, cen = [D/3, (H + zU)/3];
  const segs = [ { name: 'lower', a: [0, 0], b: [D, 0] }, { name: 'spine', a: [0, 0], b: [0, H] }, { name: 'upper', a: [0, H], b: [D, zU] } ];
  return segs.map(sg => { const dy = sg.b[0] - sg.a[0], dz = sg.b[1] - sg.a[1], L = Math.hypot(dy, dz); let ny = -dz/L, nz = dy/L;
    const mid = [(sg.a[0] + sg.b[0])/2, (sg.a[1] + sg.b[1])/2]; if ((cen[0] - mid[0])*ny + (cen[1] - mid[1])*nz < 0){ ny = -ny; nz = -nz; }
    return { ...sg, L, dir: [dy/L, dz/L], n: [ny, nz], mid }; });
}
function bcWallSvg(F, w, m, y0 = 0, y1 = 1){        // y0..y1: the part of the wall along its length to draw
  const { th, W } = BC, t0 = w.L*y0, t1 = w.L*y1, c2 = [w.a[0] + w.dir[0]*(t0 + t1)/2 + w.n[0]*th/2, w.a[1] + w.dir[1]*(t0 + t1)/2 + w.n[1]*th/2];
  const c = bcP(F, 0, c2[0], c2[1]), ax = F.X, ad = bcV(F, w.dir[0], w.dir[1]), an = bcV(F, w.n[0], w.n[1]);
  return obox(c, ax, norm(ad), norm(an), W/2, (t1 - t0)/2, th/2, m, tone, 1);
}
// a handle: a wire loop from its two ends in the roll out to a rounded end, angle ang (deg) about the roll's axis
function bcHandle(F, pivot, ang, pinch = 0){
  const a = ang*Math.PI/180, along = bcV(F, Math.cos(a), Math.sin(a)), L = BC.hl, half0 = BC.W/2 - 2.6 - 2.4*pinch, half1 = 9;
  const pts = [], P0 = bcP(F, 0, pivot[0], pivot[1]);
  const at = (s, x) => kAdd(kAdd(P0, kScl(along, s)), kScl(F.X, x));
  pts.push(at(0, -half0 + 2.2), at(0, -half0));                             // the bent-in end, inside the roll
  for (let i = 0; i <= 4; i++){ const t = i/4; pts.push(at(L*.82*t, -(half0 + (half1 - half0)*t))); }
  for (let i = 1; i < 8; i++){ const t = Math.PI*i/8; pts.push(at(L*.82 + 4*Math.sin(t), -half1*Math.cos(t))); }
  for (let i = 4; i >= 0; i--){ const t = i/4; pts.push(at(L*.82*t, half0 + (half1 - half0)*t)); }
  pts.push(at(0, half0 - 2.2));
  return pts;
}
const bcLipU = b => [BC.D + .45, b.zU + BC.r*.8], bcLipL = () => [BC.D + .45, BC.r*.6];
function bcSvg(st, m, part = 'all'){
  const b = st.bc, F = b.F, walls = bcWalls(b), clamped = st.clamped && !b.moving;
  const center = bcP(F, 0, BC.D/3, (BC.H + b.zU)/3);
  const items = [];
  // walls: the ones turned away (seen from inside) first, then the rolls, then the ones facing the viewer
  for (const w of walls){ const out = bcV(F, -w.n[0], -w.n[1]), facingW = vis(out);
    if (w.name === 'lower' && clamped){
      // the part of the lower jaw under the paper goes before the stack
      if (part !== 'over') items.push({ k: 0, svg: bcWallSvg(F, w, m, .4, 1), under: true });
      if (part !== 'under') items.push({ k: facingW ? 3 : 0, svg: bcWallSvg(F, w, m, 0, .4) });
    } else if (part !== 'under') items.push({ k: facingW ? 3 : 0, svg: bcWallSvg(F, w, m) }); }
  const rolls = [[bcLipU(b), 'u'], [bcLipL(), 'l']];
  for (const [rp, nm] of rolls){ const out = vis(bcV(F, 1, nm === 'u' ? 1 : -1));
    const svg = coaxSeg(bcP(F, -BC.W/2, rp[0], rp[1]), F.X, { s0: 0, s1: BC.W, r0: BC.r, M: m, n: 14, w: .8, shade: tone });
    if (nm === 'l' && clamped){ if (part !== 'over') items.push({ k: 0, svg, under: true }); }
    else if (part !== 'under') items.push({ k: out ? 2 : 1, svg }); }
  // handles
  const hs = [];
  if (b.hu) hs.push({ pts: bcHandle(F, bcLipU(b), b.up, b.pinchU || 0), under: false });
  if (b.hl) hs.push({ pts: bcHandle(F, bcLipL(), b.lo, b.pinchL || 0), under: clamped });
  for (const h of hs){ const c = avg(h.pts);
    if (h.under){ if (part !== 'over') items.push({ k: 0, svg: wireSvg(h.pts), under: true }); continue; }
    if (part !== 'under') items.push({ k: depthOf(c) > depthOf(center) ? 4 : -1, svg: wireSvg(h.pts) }); }
  items.sort((p, q) => p.k - q.k);
  return items.map(i => i.svg).join('');
}
const bcBox = st => { const F = st.bc.F, pts = [bcP(F, -BC.W/2, 0, 0), bcP(F, BC.W/2, BC.D + 2, 0), bcP(F, -BC.W/2, 0, BC.H), bcP(F, BC.W/2, BC.D + 2, BC.H)];
  return [[0,1,2].map(i => Math.min(...pts.map(p => p[i]))), [0,1,2].map(i => Math.max(...pts.map(p => p[i])))]; };
const bcShadowPts = st => { const F = st.bc.F, b = st.bc, pts = [];
  for (const x of [-BC.W/2, BC.W/2]) for (const [y, z] of [[0, 0], [0, BC.H], [BC.D + 1, 0], [BC.D + 1, b.zU + 1]]) pts.push(bcP(F, x, y, z));
  if (b.hu) pts.push(...bcHandle(F, bcLipU(b), b.up)); return pts; };

/* ---------- the stack, the tray ---------- */
function stackSvg(st){
  const { u0, u1, v0, v1, n, t } = STK, zt = stkTop();
  let s = deskBox(u0, v0, BH, u1, v1, zt, MAT.paper, toneI, 1);
  let d = ''; for (const [nn, a, b2] of [[DV, [u0, v1], [u1, v1]], [DU, [u1, v0], [u1, v1]], [kScl(DU, -1), [u0, v0], [u0, v1]], [kScl(DV, -1), [u0, v0], [u1, v0]]])
    if (vis(nn)) for (let j = 1; j < n; j++){ const z = BH + j*t; d += pd([dk(a[0], a[1], z), dk(b2[0], b2[1], z)], false); }
  if (d) s += `<path d="${d}" fill="none" stroke="${MAT.paper.d}" stroke-width=".3"/>`;
  const z = zt + .01;
  s += deskText(-68, -29, z, '期中考试', 6, INK, 800) + deskText(2, -29, z, '数学', 6, INK, 800)
    + deskText(-68, -18, z, '姓名', 4, INK, 700) + `<path d="${pd([dk(-57, -17.4, z), dk(-26, -17.4, z)], false)}" fill="none" stroke="${INK}" stroke-width=".6"/>`;
  let ru = ''; for (let v = -9; v < 22; v += 7) ru += pd([dk(u0 + 6, v, z), dk(u1 - 6, v, z)], false);
  s += `<path d="${ru}" fill="none" stroke="#b9c4cf" stroke-width=".5"/>`;
  s += graphite([...deskHand('98', 2, -8, z, 12, 4)], '#d4473f', .9, 1) + graphite([[dk(-1, -5.5, z), dk(20, -6, z)], [dk(0, -4, z), dk(18, -4.5, z)]], '#d4473f', .7, 1);
  for (const v of [-2, 5, 12]) s += graphite(deskHand('v/', -70, v, z, 4, v + 40), '#d4473f', .7, 1);
  return s + hullInk(deskBoxPts(u0, v0, BH, u1, v1, zt), 1.3);
}
function traySvg(st, m){
  const { u0, u1, v0, v1, h, wall } = TRAY, TM = matOf('#9ec7d9'), z1 = BH + h;
  // walls as four slabs and a floor, sorted for the view: far walls, floor, the clips in it, near walls
  const W = [ { nm: 'n0', box: [u0, v0, u1, v0 + wall], n: kScl(DV, -1) }, { nm: 'n1', box: [u0, v1 - wall, u1, v1], n: DV },
              { nm: 'w0', box: [u0, v0 + wall, u0 + wall, v1 - wall], n: kScl(DU, -1) }, { nm: 'w1', box: [u1 - wall, v0 + wall, u1, v1 - wall], n: DU } ];
  const svg = w => deskBox(w.box[0], w.box[1], BH, w.box[2], w.box[3], z1, TM, toneI, .9);
  let s = W.filter(w => !vis(w.n)).map(svg).join('');
  s += deskBox(u0 + wall, v0 + wall, BH, u1 - wall, v1 - wall, BH + 1, TM, toneI, .6);
  st.tray.slice(0, st.inTray).forEach(c => { s += wireSvg(clipPts(clipAt(c.u, c.v, c.r, BH + 1.6 + c.z), gemPath()), WIRE_R, c.col); });
  s += W.filter(w => vis(w.n)).map(svg).join('');
  return s + hullInk(deskBoxPts(u0, v0, BH, u1, v1, z1), 1.3);
}

/* ---------- scene ---------- */
const boxOf = (pts, r = 0) => [[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - r), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + r)];
// the paperclip on the stack's corner: inner loop under the top sheet's edge, outer loop on top
function onStackClip(st){ const c = clipAt(STK.u1 - 31, 21, 0, 0), path = gemPath(), zt = stkTop();
  const zs = path.map((_, i) => GEM_INNER[i] ? BH - .2 + WIRE_R : zt + WIRE_R); return { c: { ...c, zs }, path }; }
function scene(st, m){
  let s = deskBoard(DLU, DLV, BH, 6, WOOD);
  const stPts = deskBoxPts(STK.u0, STK.v0, BH, STK.u1, STK.v1, stkTop()), trPts = deskBoxPts(TRAY.u0, TRAY.v0, BH, TRAY.u1, TRAY.v1, BH + TRAY.h);
  s += castShadow(stPts, BH, BTOP) + castShadow(trPts, BH, BTOP) + castShadow(bcShadowPts(st), BH, BTOP);
  // under the stack: the binder's lower jaw / handle when clamped, the clipped paperclip's inner loop
  s += bcSvg(st, m, 'under');
  const onClip = st.pc === 'on' ? onStackClip(st) : null;
  if (onClip){ const pts = clipPts(onClip.c, onClip.path); s += wireSvg(pts.filter((_, i) => i >= GEM_JOIN)); }
  s += act('stack', stackSvg(st));
  if (onClip){ const pts = clipPts(onClip.c, onClip.path); s += wireSvg(pts.filter((_, i) => i <= GEM_JOIN)); }
  // loose binder handles, the chain, the unbent wire: flat things on the desk
  for (const lh of st.looseH) s += wireSvg(lh);
  st.chain.forEach((c, i) => { s += wireSvg(clipPts(chainClip(i), gemPath()), WIRE_R, c.col); });
  if (st.wire) s += wireSvg(clipPts(st.wire.c, gemPath(st.wire.open, st.wire.kink)), WIRE_R, st.wire.col);
  // the tray, the binder clip, a paperclip in flight, sorted
  const items = [ { box: boxOf(trPts), svg: act('tray', traySvg(st, m)) }, { box: bcBox(st), svg: act('binder', bcSvg(st, m, st.clamped ? 'over' : 'all')) } ];
  s += byDepth(items);
  if (st.fly) s += wireSvg(clipPts(st.fly.c, gemPath()), WIRE_R, st.fly.col);
  s += labels(st);
  return s;
}
const chainClip = i => { const c = clipAt(CHAIN0[0] + i*LINK_PITCH, CHAIN0[1] + (i % 2 ? 1.2 : -1.2), (i % 2 ? 180 : 0) + (i % 2 ? -4 : 4), BH + WIRE_R + (i % 2 ? .9 : 0));
  return i % 2 ? { ...c, O: kAdd(c.O, kScl(c.A, -33 + 2)) } : c; };
function labels(st){
  const F = st.bc.F, b = st.bc, items = [
    { at: bcP(F, -6, BC.D*.5, (BC.H + b.zU)/2 + .5), text: '长尾夹', on: !!b.moving },
    { at: bcP(F, BC.W/2 - 2, ...bcLipU(b)), text: '卷边', on: !!b.moving },
    { at: dk(STK.u0 + 10, STK.v1, stkTop()), text: '试卷', on: st.clamped },
    { at: dk(TRAY.u0 + 6, TRAY.v1, BH + TRAY.h), text: '回形针盒', on: !!st.fly } ];
  if (b.hu){ const h = bcHandle(F, bcLipU(b), b.up); items.push({ at: h[9], text: '把手', on: !!b.moving }); }
  if (st.pc === 'on'){ const o = onStackClip(st); items.push({ at: clipPts(o.c, o.path)[12], text: '回形针', on: false }); }
  if (st.chain.length) items.push({ at: clipPts(chainClip(st.chain.length - 1), gemPath())[4], text: '回形针链', on: false });
  if (st.wire) items.push({ at: clipPts(st.wire.c, gemPath(st.wire.open, st.wire.kink))[20], text: '掰直的回形针', on: false });
  return zhCallouts(items, [...(() => { const q = deskTop(DLU - 70, DLV - 60, 0); return [Math.min(...q.map(p => p[0])), Math.max(...q.map(p => p[0])), Math.min(...q.map(p => p[1])), Math.max(...q.map(p => p[1]))]; })(), 0, 30]);
}

/* ---------- actions ---------- */
let ui;
const BUSY = { clamp: '还在夹', pclip: '正在别', chain: '正在串', bend: '正在掰', handle: '正在拆' };
const busy = () => { if (!kBusy()) return false; ui.flash(BUSY[kBusy()] || '等一下'); return true; };
const frameLerp = (A, B, e, h = 0) => bcF(kAdd(kLerp(A.O, B.O, e), [0, 0, h*Math.sin(Math.PI*e)]), A.ang + (B.ang - A.ang)*e);
const ZC = .6;                                   // jaw tip height, closed on nothing
const zOn = () => STK.n*STK.t + .35;             // closed on the stack
const tween = (st, key, to, ms, ez = ease) => ({ ms, start(){ this.a = st.bc[key]; }, step(e){ st.bc[key] = this.a + (to - this.a)*ez(e); } });
// put the handles back: the loose ones fly back and their ends snap into the rolled edges
function handleBackSegs(st){
  if (st.bc.hu && st.bc.hl) return [];
  return [{ ms: 500, start(){ ui.flash('先把把手按回卷边里'); }, step(e){ st.looseH = st.looseH.map(h => h.map(p => kAdd(p, [0, 0, 2*Math.sin(Math.PI*e)]))); },
    end(){ st.looseH = []; st.bc.hu = st.bc.hl = true; st.bc.pinchU = st.bc.pinchL = 0; } }];
}
function clamp(st){ if (busy()) return;
  const b = st.bc, segs = [...handleBackSegs(st)], H0 = { up: 140, lo: 0 };
  const hold = F => bcF(kAdd(F.O, [0, 0, 24]), F.ang);
  if (!st.clamped){
    segs.push({ ms: 420, start(){ b.moving = true; this.F0 = b.F; this.u = b.up; this.l = b.lo; }, step(e){ const g = ease(e); b.F = frameLerp(this.F0, hold(BC_REST), g); b.up = this.u + (125 - this.u)*g; b.lo = this.l + (-125 - this.l)*g; } });
    segs.push({ ms: 300, start(){ this.z = b.zU; }, step(e){ const g = ease(e); b.up = 125 + 27*g; b.lo = -125 - 27*g; b.zU = this.z + (7 - this.z)*g; } });
    segs.push({ ms: 650, start(){ this.F0 = b.F; }, step(e){ b.F = frameLerp(this.F0, bcF(kAdd(BC_ON.O, [0, 0, 6]), BC_ON.ang), ease(e)); b.lo = -152 + 152*ease(e); } });
    segs.push({ ms: 260, start(){ this.F0 = b.F; }, step(e){ b.F = frameLerp(this.F0, BC_ON, ease(e)); } });
    segs.push({ ms: 260, step(e){ const g = ease(e); b.up = 152 - 27*g; b.zU = 7 + (zOn() - 7)*g; }, end(){ st.clamped = true; } });
    segs.push({ ms: 480, step(e){ b.up = 125*(1 - ease(e)); }, end(){ b.moving = false; } });
    kPlay(ui, 'clamp', segs, () => ui.flash('一松手，弹簧钢就把整叠卷子夹紧了'));
  } else {
    segs.push({ ms: 380, start(){ b.moving = true; st.clamped = false; this.u = b.up; }, step(e){ const g = ease(e); b.up = this.u + (152 - this.u)*g; b.zU = zOn() + (7 - zOn())*g; } });
    segs.push({ ms: 560, start(){ this.F0 = b.F; }, step(e){ b.F = frameLerp(this.F0, BC_REST, ease(e), 16); } });
    segs.push({ ms: 300, step(e){ const g = ease(e); b.up = 152 + (H0.up - 152)*g; b.zU = 7 + (ZC - 7)*g; }, end(){ b.moving = false; } });
    kPlay(ui, 'clamp', segs, () => ui.flash('松开了，放回桌上'));
  }
}
// squeeze one handle's legs together until its ends slip out of the rolled edge: it comes off, the clip lies flat
function dropHandle(st){ if (busy()) return;
  const b = st.bc;
  if (!b.hu && !b.hl) return ui.flash('两个把手都拆光了');
  const which = b.hu ? 'U' : 'L', key = 'pinch' + which;
  kPlay(ui, 'handle', [
    { ms: 380, step(e){ b[key] = ease(e); } },
    { ms: 460, start(){ const pts = bcHandle(b.F, which === 'U' ? bcLipU(b) : bcLipL(), which === 'U' ? b.up : b.lo, 1);
        this.pts = pts; if (which === 'U') b.hu = false; else b.hl = false; this.c = avg(pts);
        this.to = dk(50 + 24*st.looseH.length, 12, BH + WIRE_R); this.i = st.looseH.length; st.looseH.push(pts); },
      step(e){ const g = ease(e), off = kAdd(kScl(sub(this.to, this.c), g), [0, 0, 10*Math.sin(Math.PI*e)]);
        // the loop also lies down flat as it falls
        st.looseH[this.i] = this.pts.map(p => { const q = kAdd(p, off), zc = this.to[2]; return [q[0], q[1], q[2] + (zc - q[2])*g]; }); } } ],
    () => ui.flash(which === 'U' ? '一捏把手两头就从卷边里滑出来——夹子扁了，能塞进笔袋' : '另一个也拆了——现在谁也捏不开它了', 2600));
}
// a paperclip from the tray flies to (and onto) a target frame
function takeClip(st){ const c = st.tray[st.inTray - 1]; st.inTray--; return { c: clipAt(c.u, c.v, c.r, BH + 1.6 + c.z), col: c.col }; }
function flySegs(st, to, after){
  return [{ ms: 620, start(){ const t = takeClip(st); st.fly = t; this.c0 = t.c; },
    step(e){ const g = ease(e), c0 = this.c0; st.fly.c = { O: kAdd(kLerp(c0.O, to.O, g), [0, 0, 22*Math.sin(Math.PI*e)]), A: norm(kLerp(c0.A, to.A, g)), B: norm(kLerp(c0.B, to.B, g)) }; },
    end(){ const col = st.fly.col; st.fly = null; after(col); } }];
}
function pclip(st){ if (busy()) return;
  if (st.pc === 'on'){ kPlay(ui, 'pclip', [{ ms: 300, step(){}, end(){ st.pc = null; st.inTray++; } }], () => ui.flash('取下来放回盒子')); return; }
  if (!st.inTray) return ui.flash('盒子里没有回形针了');
  const t = onStackClip(st), to = { O: kAdd(t.c.O, [0, 0, stkTop() + WIRE_R]), A: t.c.A, B: t.c.B };
  const slide = { O: kAdd(to.O, kScl(to.A, 10)), A: to.A, B: to.B };
  kPlay(ui, 'pclip', [...flySegs(st, slide, col => { st.pcCol = col; st.fly = { c: slide, col }; }),
    { ms: 360, step(e){ st.fly.c = { ...slide, O: kAdd(slide.O, kScl(slide.A, -10*ease(e))) }; }, end(){ st.fly = null; st.pc = 'on'; } }],
    () => ui.flash('纸夹进内外两个环之间，钢丝的弹力压住它'));
}
function chain(st){ if (busy()) return;
  if (st.chain.length >= CHAIN_MAX) return ui.flash('链子已经跟桌子一样长了');
  if (!st.inTray) return ui.flash('盒子里没有回形针了');
  const i = st.chain.length, target = chainClip(i);
  kPlay(ui, 'chain', flySegs(st, { ...target, O: kAdd(target.O, [0, 0, 0]) }, col => st.chain.push({ col })),
    () => ui.flash(st.chain.length > 1 ? `一环扣一环，串了 ${st.chain.length} 个` : '第一个放好了，再串下一个'));
}
function bend(st){ if (busy()) return;
  if (st.wire) return ui.flash('桌上那根已经掰直了');
  if (!st.inTray) return ui.flash('盒子里没有回形针了');
  const spot = clipAt(-20, 39, 180, BH + WIRE_R);      // turned so the straightened wire runs off to the right, along the desk
  const segs = flySegs(st, spot, col => { st.wire = { c: spot, open: [0, 0, 0], kink: 0, col }; });
  for (const k of [2, 1, 0]) segs.push({ ms: 520, step(e){ st.wire.open[k] = ease(e); } });   // inner bend, end bend, big outer bend
  segs.push({ ms: 360, step(e){ st.wire.kink = ease(e); } });
  kPlay(ui, 'bend', segs, () => { st.bent++; ui.flash('掰了一节课，还是掰不回一根直线', 2400); });
}

const CLIP_COLS = [WIRE, WIRE, '#f08a8a', WIRE, '#8fd0a8', WIRE, '#f2c94c', WIRE, '#86b6f0', WIRE, WIRE, '#f3a6bb', WIRE, WIRE];
const trayFill = () => { const rnd = kRng(9); return CLIP_COLS.map((col, i) => ({ u: TRAY.u0 + 6 + rnd()*(TRAY.u1 - TRAY.u0 - 46), v: TRAY.v0 + 8 + rnd()*(TRAY.v1 - TRAY.v0 - 18), r: (rnd() - .5)*70, z: i*.28, col })); };
ui = mountFigure({
  fig:'14', turn:'full', title:'长尾夹和回形针', size: DESK.size, center: DESK.center, palette:'tomato',
  state:{ bc: { F: BC_REST, zU: ZC, up: 140, lo: 0, hu: true, hl: true, pinchU: 0, pinchL: 0, moving: false }, clamped: false,
    tray: trayFill(), inTray: N_CLIPS, pc: null, chain: [], wire: null, fly: null, looseH: [], bent: 0 },
  scene,
  stats: st => [ { label:'盒里', value: `${st.inTray} 个` }, { label:'链子', value: `${st.chain.length} 节`, small: true } ],
  buttons:[
    { label:'夹住试卷', onClick: clamp },
    { label:'别回形针', onClick: pclip },
    { label:'掰直回形针', onClick: bend },
    { label:'串成链子', onClick: chain },
    { label:'拆长尾夹把手', onClick: dropHandle },
  ],
  acts:{ binder: st => clamp(st), tray: st => chain(st), stack: st => pclip(st) },
  params:(st, q) => {
    const b = st.bc;
    if (q.get('clamped') === '1'){ st.clamped = true; b.F = BC_ON; b.zU = zOn(); b.up = 0; b.lo = 0; }
    if (q.has('up')) b.up = +q.get('up');
    if (q.has('lo')) b.lo = +q.get('lo');
    if (q.has('jaw')) b.zU = +q.get('jaw');
    if (q.has('air')) b.F = bcF(kAdd(b.F.O, [0, 0, +q.get('air')]), b.F.ang);
    if (q.has('handles')){ const h = +q.get('handles'); b.hu = h > 0; b.hl = h > 1;
      if (!b.hu) st.looseH.push(bcHandle(bcF(dk(40, -6, BH), 0), [0, 0], 0, 1).map(p => [p[0], p[1], BH + WIRE_R])); }
    if (q.get('pc') === '1'){ st.pc = 'on'; st.inTray--; }
    if (q.has('chain')) for (let i = 0; i < +q.get('chain'); i++){ st.chain.push({ col: CLIP_COLS[(i*3) % CLIP_COLS.length] }); st.inTray--; }
    if (q.has('wire')){ const o = +q.get('wire'); st.wire = { c: clipAt(-20, 39, 180, BH + WIRE_R), open: [Math.min(1, o*3), Math.min(1, Math.max(0, o*3 - 1)), Math.min(1, Math.max(0, o*3 - 2))].reverse(), kink: o >= 1 ? 1 : 0, col: WIRE }; st.inTray--; }
  },
});
xrMount(() => ui, () => '', { labelsOnly: true });
</script></body></html>
